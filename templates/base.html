<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaceLens | AI Landmark Discovery</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#FFF3E0',   /* Lightest Orange */
                            100: '#FFE0B2',
                            500: '#FB8C00',  /* Main Google Orange */
                            600: '#F57C00',
                            700: '#EF6C00',
                            900: '#E65100',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Flat Map Design */
        #map {
            height: 100%;
            min-height: 480px;
            width: 100%;
            z-index: 1;
            border-radius: 1rem;
            border: 1px solid #DADCE0;
            /* Google's standard border color */
        }

        /* Material 3 Surface: Flat white, no blur, simple border */
        .nav-flat {
            background: #FFFFFF;
            border-bottom: 1px solid #DADCE0;
        }

        /* Smooth, flat transition */
        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom Scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }
    </style>
</head>

<body
    class="bg-white text-[#202124] font-sans antialiased min-h-screen flex flex-col selection:bg-brand-100 selection:text-brand-900">

    <nav class="sticky top-0 z-50 nav-flat">
        <div class="container mx-auto px-6 py-3 flex justify-between items-center">
            <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                <div class="w-9 h-9 rounded-xl bg-brand-500 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                    </svg>
                </div>
                <span class="text-xl font-semibold tracking-tight text-[#202124]">
                    Place<span class="text-brand-500">Lens</span>
                </span>
            </a>

            <div class="hidden md:flex items-center gap-4">
                <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-green-50 border border-green-100">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <span class="text-[10px] font-bold text-green-700 uppercase tracking-widest">Vision Engine
                        Online</span>
                </div>

                <a href="{% url 'app' %}"
                    class="text-sm font-medium text-gray-600 hover:text-brand-600 px-4 py-2 rounded-lg transition-colors">
                    Dashboard
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-6 py-8 max-w-7xl fade-in">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="border-t border-[#DADCE0] py-8 bg-white">
        <div class="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-gray-500 text-xs font-medium tracking-wide uppercase">
                &copy; 2026 PlaceLens AI • Pakistan Landmark Intelligence
            </p>
            <div class="flex gap-6">
                <a href="#" class="text-xs text-gray-400 hover:text-brand-500 transition-colors">Privacy</a>
                <a href="#" class="text-xs text-gray-400 hover:text-brand-500 transition-colors">Terms</a>
            </div>
        </div>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
